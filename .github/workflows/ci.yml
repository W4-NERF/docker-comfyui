name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # DL3008: intentionally not pinning apt package versions (Debian
          # bookworm's repo already pins the ABI).
          # DL3013: the torch/GitPython/openai-agents installs are
          # deliberately unpinned by default — see TORCH_PACKAGES /
          # OPENAI_AGENTS_PACKAGE in this Dockerfile and the "Pinning
          # torch / Manager / openai-agents" section in the README.
          # (hadolint-action's `ignore` input takes a comma-separated list on
          # one line, not a YAML block scalar — a multi-line list is silently
          # not applied.)
          ignore: DL3008,DL3013

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: ".git"

  build:
    name: Build image (sanity check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: docker-comfyui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-config:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
